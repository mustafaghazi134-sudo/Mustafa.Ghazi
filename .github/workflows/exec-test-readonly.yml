# READ-ONLY rehearsal of the supervised execution test: real Jupiter routes, verification and simulation on the real
# chain, wallet balances by public address. No keys, no secrets, nothing signed or submitted.
# Trigger: push a change to TRADEBOT/deploy/exec_test_readonly.trigger (optionally with TRADEBOT/deploy/exec_test_wallet.txt
# holding the owner's PUBLIC test-wallet address).
name: exec-test-readonly

on:
  push:
    branches: [claude/inspiring-edison-6xsm35]
    paths: [TRADEBOT/deploy/exec_test_readonly.trigger]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exec-test-readonly
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: TRADEBOT
    env:
      TRADEBOT_CONFIG: deploy/paper_ci.toml
      TRADEBOT_DATA_DIR: /tmp/rehearsal
      TRADEBOT_FORCE_PAPER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q -e .
      - name: Rehearsal (read-only)
        run: |
          mkdir -p paper_evidence/exec_test
          python deploy/exec_test_readonly.py 6 > "paper_evidence/exec_test/rehearsal_$(date -u +%Y%m%dT%H%M%SZ).txt" 2>&1 || true
          cat paper_evidence/exec_test/rehearsal_*.txt | tail -40
      - name: Commit the rehearsal output
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRADEBOT/paper_evidence/exec_test
          git commit -q -m "Execution-test rehearsal output (read-only)" || exit 0
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
