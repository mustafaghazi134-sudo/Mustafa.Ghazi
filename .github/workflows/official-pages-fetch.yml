# Read-only fetch of official venue, issuer and regulator pages as text, so feasibility claims can be checked
# against primary sources (the build container cannot reach these hosts). No accounts, keys or secrets.
# Trigger: push a change to TRADEBOT/deploy/official_pages.trigger.
name: official-pages-fetch

on:
  push:
    branches: [claude/inspiring-edison-6xsm35]
    paths: [TRADEBOT/deploy/official_pages.trigger]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-pages-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch pages
        working-directory: TRADEBOT
        run: python deploy/fetch_official_pages.py
      - name: Commit pages to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRADEBOT/research_lab/data_ext/official_pages
          git commit -q -m "Official pages fetch for the feasibility study" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
