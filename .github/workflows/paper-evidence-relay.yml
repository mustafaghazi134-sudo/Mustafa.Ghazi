# Copies the checkpoint text files of the latest paper-trading run into TRADEBOT/paper_evidence/run-<id>/ on this
# branch, so the evidence can be read without downloading artifacts. It does not touch the running paper job.
# Trigger: push a change to TRADEBOT/deploy/evidence_request.trigger.
name: paper-evidence-relay

on:
  push:
    branches: [claude/inspiring-edison-6xsm35]
    paths: [TRADEBOT/deploy/evidence_request.trigger]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: paper-evidence-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download checkpoint artifacts of the latest paper run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --workflow paper-trading.yml --branch "$GITHUB_REF_NAME" --limit 1 --json databaseId -q '.[0].databaseId')
          echo "latest paper run: $RUN"
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          mkdir -p "TRADEBOT/paper_evidence/run-$RUN" /tmp/arts
          gh run download "$RUN" --dir /tmp/arts || echo "download reported an error (artifacts may still be uploading)"
          find /tmp/arts -name '*.txt' -exec cp {} "TRADEBOT/paper_evidence/run-$RUN/" \;
          gh run view "$RUN" --json status,conclusion,createdAt,updatedAt > "TRADEBOT/paper_evidence/run-$RUN/run_status.json" || true
          ls -la "TRADEBOT/paper_evidence/run-$RUN"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read-only signal state on live candles (same code and config as the paper engine)
        working-directory: TRADEBOT
        env:
          TRADEBOT_CONFIG: deploy/paper_ci.toml
          TRADEBOT_DATA_DIR: /tmp/relay_data
          TRADEBOT_FORCE_PAPER: "1"
        run: |
          pip install -q -e .
          python deploy/signal_state.py > "paper_evidence/run-$RUN/signal_state_$(date -u +%Y%m%dT%H%M%SZ).txt" 2>&1 || true
      - name: Commit evidence to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRADEBOT/paper_evidence
          git commit -q -m "Paper evidence relay: checkpoints of run $RUN" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
