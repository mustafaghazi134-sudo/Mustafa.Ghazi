# Bounded, read-only fetch of public research data (funding history, wrapped-asset prices and pool liquidity) for
# the long/short feasibility study. No keys or secrets; nothing is signed or traded. Commits CSVs to
# TRADEBOT/research_lab/data_ext/ on this branch. Trigger: push a change to TRADEBOT/deploy/research_fetch.trigger.
name: research-data-fetch

on:
  push:
    branches: [claude/inspiring-edison-6xsm35]
    paths: [TRADEBOT/deploy/research_fetch.trigger]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-data-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch public data
        working-directory: TRADEBOT
        run: python deploy/fetch_research_data.py
      - name: Commit data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRADEBOT/research_lab/data_ext
          git commit -q -m "Research data fetch: funding history and wrapped-asset prices" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          exit 1
